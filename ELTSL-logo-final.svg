<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 200 200" 
     width="200mm" 
     height="200mm"
     version="1.1">
  
  <title>ELTSL - Eesti Lohe- ja Tiivasurfi Liit</title>
  <desc>Official logo. Print colors - Blue: Pantone 301 C / CMYK(100,45,0,18) / #0066B3 | Black: CMYK(0,0,0,100) / #000000</desc>
  
  <defs>
    <path id="textCircle" d="M 12,118 A 88,88 0 0,1 188,118" fill="none"/>
  </defs>
  
  <!-- Circular text -->
  <text font-family="Impact, 'Arial Black', Haettenschweiler, sans-serif" 
        font-size="14.5" 
        fill="#000000"
        letter-spacing="0.8">
    <textPath xlink:href="#textCircle" startOffset="50%" text-anchor="middle">
      EESTI LOHE- JA TIIVASURFI LIIT
    </textPath>
  </text>
  
  <!-- Blue kite/crescent shape -->
  <path d="M 67,48
           C 52,58 40,74 35,94
           C 30,114 33,134 46,148
           C 54,142 63,134 73,125
           C 83,116 94,106 105,97
           C 96,82 86,67 75,55
           C 72,51 69,49 67,48
           Z" 
        fill="#0066B3"/>
  
  <!-- Black wing - main shape -->
  <path d="M 105,97
           C 116,91 130,87 144,87
           C 158,87 168,93 172,103
           C 175,114 171,127 162,140
           C 153,153 139,162 122,167
           C 105,172 90,173 80,170
           C 96,160 110,146 120,130
           C 130,114 128,106 105,97
           Z"
        fill="#000000"/>
  
  <!-- Black wing - inner detail -->
  <path d="M 114,104
           C 120,112 125,123 127,136
           C 129,149 127,159 122,164
           C 114,162 107,159 102,156
           C 108,146 113,134 115,121
           C 117,112 116,108 114,104
           Z"
        fill="#1a1a1a"/>
  
  <!-- ELTSL text -->
  <text x="100" y="190" 
        font-family="Impact, 'Arial Black', Haettenschweiler, sans-serif"
        font-size="24" 
        fill="#000000" 
        text-anchor="middle"
        letter-spacing="2">
    ELTSL
  </text>
  
</svg>
