<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- 
    Eesti Lohe- ja Tiivasurfi Liit Logo
    Estonian Kite and Wing Surfing Association
    Vector format for print and web
    
    Colors:
    Blue: #2462AB
    Black: #000000
  -->
  <defs>
    <style>
      .text-curved { 
        font-family: 'Arial Black', 'Arial', 'Helvetica Neue', sans-serif; 
        font-weight: 900;
        font-style: italic;
      }
      .text-bottom { 
        font-family: 'Arial Black', 'Arial', 'Helvetica Neue', sans-serif; 
        font-weight: 900;
        font-style: italic;
      }
    </style>
    <!-- Text arc path -->
    <path id="textArc" d="M 35,330 A 215,215 0 1,1 465,330" fill="none"/>
  </defs>

  <!-- Curved text around the top -->
  <text class="text-curved" font-size="32" fill="#000000" letter-spacing="6">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      EESTI LOHE- JA TIIVASURFI LIIT
    </textPath>
  </text>

  <!-- Blue crescent shape -->
  <path d="M 165,128
           C 105,155 75,218 85,290
           C 95,352 135,395 190,415
           C 152,382 138,332 145,282
           C 152,218 195,160 258,128
           C 218,118 180,120 165,128
           Z"
        fill="#2462AB"/>

  <!-- Black wing - outer layer -->
  <path d="M 255,115
           C 315,128 380,185 412,272
           C 428,320 425,365 405,398
           L 288,320
           L 225,405
           L 195,400
           C 232,348 262,288 278,232
           C 295,175 282,132 255,115
           Z"
        fill="#000000"/>

  <!-- White gap 1 -->
  <path d="M 275,152
           C 328,165 385,218 412,295
           C 425,338 422,380 408,410
           L 305,342
           L 250,412
           L 222,408
           C 255,360 285,305 300,255
           C 318,202 305,162 275,152
           Z"
        fill="white"/>

  <!-- Black layer 2 -->
  <path d="M 295,188
           C 342,202 392,250 415,320
           C 428,360 425,398 412,425
           L 318,362
           L 270,428
           L 245,422
           C 278,378 305,328 320,282
           C 338,232 325,195 295,188
           Z"
        fill="#000000"/>

  <!-- White gap 2 -->
  <path d="M 315,225
           C 358,238 402,282 422,348
           C 432,385 430,418 418,442
           L 335,385
           L 292,445
           L 270,440
           C 300,400 325,355 340,312
           C 358,265 345,232 315,225
           Z"
        fill="white"/>

  <!-- Black layer 3 (innermost) -->
  <path d="M 338,265
           C 375,278 415,318 432,378
           C 442,410 440,440 428,462
           L 355,410
           L 318,465
           L 298,460
           C 325,425 350,382 365,345
           C 382,302 372,272 338,265
           Z"
        fill="#000000"/>

  <!-- ELTSL bottom text -->
  <text x="250" y="475" text-anchor="middle" class="text-bottom" font-size="44" letter-spacing="12" fill="#000000">
    ELTSL
  </text>
</svg>
