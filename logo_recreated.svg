<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500mm" height="500mm">
  <!-- 
    Eesti Lohe- ja Tiivasurfi Liit Logo - Recreation
    Manual trace to match original design.
  -->
  <defs>
    <style>
      .text { font-family: 'Arial Narrow', 'Helvetica Condensed', 'Arial', sans-serif; font-weight: bold; }
    </style>
    <!-- Text Curve Path - Adjusted to be tighter if needed -->
    <path id="textCurve" d="M 50,260 A 200,200 0 1,1 450,260" fill="none" />
  </defs>

  <!-- Circular Text -->
  <text class="text" font-size="38" fill="#000000" letter-spacing="1">
    <textPath href="#textCurve" startOffset="50%" text-anchor="middle">
      EESTI LOHE- JA TIIVASURFI LIIT
    </textPath>
  </text>

  <!-- Central Graphic Symbol -->
  <g transform="translate(250, 260) scale(1.0)">
     <!-- Blue Shape (Left) -->
     <!-- Recreating the shape based on the visual: 
          A thick crescent/kidney shape on the left.
          Color: #0047AB (Standard Blue)
     -->
     <path d="M -10,-80 
              C -90,-60 -110,60 -30,100 
              C -60,40 -40,-20 -10,-80 
              Z"
           fill="#0047AB" stroke="none" />

     <!-- Black Shape (Right) -->
     <!-- A triangular fin shape on the right.
          Pointy top, wider bottom.
     -->
     <path d="M 10,-70 
              C 70,-30 90,50 60,100 
              C 80,40 50,-20 10,-70 
              Z"
           fill="#000000" stroke="none" />
  </g>

  <!-- Bottom Text -->
  <text x="250" y="450" text-anchor="middle" class="text" font-size="52" letter-spacing="2" fill="#000000">
    ELTSL
  </text>
</svg>
