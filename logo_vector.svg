<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500mm" height="500mm">
  <defs>
    <!-- Määra teksti teekond. Raadius u 200px (400px diameeter) -->
    <path id="textCurve" d="M 50,260 A 200,200 0 1,1 450,260" fill="none" />
  </defs>

  <!-- Ülemine tekst: EESTI LOHE- JA TIIVASURFI LIIT -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="36" fill="black" letter-spacing="1">
    <textPath href="#textCurve" startOffset="50%" text-anchor="middle">
      EESTI LOHE- JA TIIVASURFI LIIT
    </textPath>
  </text>

  <!-- Keskmine graafika -->
  <g transform="translate(250, 260)">
    <!-- Sinine kujund (Vasak) -->
    <path d="M -15,-90
             A 95,95 0 0,0 -15,90
             Q -50,0 -15,-90
             Z"
          fill="#0047AB" />

    <!-- Must kujund (Parem) -->
    <path d="M 15,-80
             Q 100,-20 80,90
             Q 50,50 15,90
             Q 40,0 15,-80
             Z"
          fill="black" />
  </g>

  <!-- Alumine tekst: ELTSL -->
  <text x="250" y="450" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" text-anchor="middle" fill="black" letter-spacing="3">
    ELTSL
  </text>
</svg>
